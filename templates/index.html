<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Generator</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            --primary: #00f2fe;
            --secondary: #4facfe;
            --surface: rgba(255, 255, 255, 0.1);
            --text: #ffffff;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: var(--surface);
            backdrop-filter: blur(10px);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 600px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: fadeIn 0.8s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h1 {
            margin-top: 0;
            font-size: 2.5rem;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2rem;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        input[type="text"] {
            padding: 1rem;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(0, 0, 0, 0.2);
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }
        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
        }
        input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        button {
            padding: 1rem;
            border: none;
            border-radius: 10px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            color: #000;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        .video-container {
            margin-top: 2rem;
            animation: fadeIn 0.5s ease-out forwards;
        }
        video {
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
        }
        .loading {
            display: none;
            margin-top: 1rem;
            font-size: 1.1rem;
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Video Generator</h1>
        <form method="POST" onsubmit="showLoading()">
            <input type="text" name="prompt" placeholder="Describe your video..." required>
            <button type="submit">Generate Video</button>
        </form>
        <div class="loading" id="loadingText">Generating your video... this may take a few moments.</div>
        {% if video %}
        <div class="video-container">
            <video controls autoplay>
                <source src="{{ url_for('static', filename=video) }}" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
        {% endif %}
    </div>
    <script>
        function showLoading() {
            document.getElementById('loadingText').style.display = 'block';
        }
    </script>
</body>
</html>
